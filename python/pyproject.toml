[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitextwatermarkremover-tools"
version = "0.1.0"
description = "Local utilities to scan and remove invisible Unicode characters from text. Independent helper inspired by aitextwatermarkremover.com. Runs offline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AI Text Watermark Remover Tools contributors" }]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.urls]
Homepage = "https://aitextwatermarkremover.com/"
Repository = "https://github.com/bbwdadfg/aitextwatermarkremover-tools"

[tool.hatch.build.targets.wheel]
packages = ["src/atwrtools"]
